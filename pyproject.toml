[project]
name = "elba-mcp"
dynamic = ["version"]
description = "MCP-сервер Контур.Эльбы: счета, акты, УПД, ссылки на документы, контроль оплат"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Игорь Батраков" }]
# верхняя граница — как в метаданных скрипта: под 3.15 зависимости не проверены
requires-python = ">=3.12,<3.15"
dependencies = ["mcp>=2.3,<3"]
keywords = ["mcp", "kontur", "elba", "эльба", "контур", "счета", "бухгалтерия"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: Russian",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Homepage = "https://github.com/igor-batrakov/elba-mcp"
Issues = "https://github.com/igor-batrakov/elba-mcp/issues"

[project.scripts]
elba-mcp = "elba_mcp:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "elba_mcp.py"

[tool.hatch.build.targets.wheel]
only-include = ["elba_mcp.py"]

[tool.hatch.build.targets.sdist]
only-include = ["elba_mcp.py", "tests", "README.md", "LICENSE", "pyproject.toml"]
